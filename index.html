<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>爆点逃跑游戏</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 420px;
      background: #111827;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 0 30px rgba(0,0,0,0.4);
    }

    h1 {
      text-align: center;
      margin: 10px 0 5px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .card {
      background: #1f2937;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 15px;
    }

    .balance {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
    }

    .number {
      text-align: center;
      font-size: 56px;
      font-weight: bold;
      color: #22c55e;
      margin: 20px 0;
    }

    .status {
      text-align: center;
      min-height: 28px;
      color: #e5e7eb;
      font-size: 16px;
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 18px;
      margin-top: 10px;
      background: #374151;
      color: white;
      outline: none;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
      margin-top: 12px;
      cursor: pointer;
    }

    .start {
      background: #22c55e;
      color: #052e16;
    }

    .cashout {
      background: #facc15;
      color: #422006;
    }

    .reset {
      background: #334155;
      color: #fff;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .history-title {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .history {
      max-height: 220px;
      overflow-y: auto;
      font-size: 14px;
      color: #d1d5db;
    }

    .item {
      padding: 10px;
      border-radius: 10px;
      background: #374151;
      margin-bottom: 8px;
    }

    .win {
      color: #22c55e;
    }

    .lose {
      color: #ef4444;
    }

    .tips {
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
      line-height: 1.6;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>爆点逃跑</h1>
    <div class="subtitle">点数上涨前逃跑，逃早赢少，逃晚可能爆掉</div>

    <div class="card balance">
      <div>模拟余额</div>
      <div><b id="balance">1000</b> 分</div>
    </div>

    <div class="card">
      <div class="number" id="point">1.00x</div>
      <div class="status" id="status">输入下注分数，点击开始</div>

      <input id="bet" type="number" value="10" min="1" placeholder="输入下注分数" />

      <button class="start" id="startBtn" onclick="startGame()">开始游戏</button>
      <button class="cashout" id="cashoutBtn" onclick="cashOut()" disabled>立即逃跑</button>
      <button class="reset" onclick="resetGame()">重置余额</button>
    </div>

    <div class="card">
      <div class="history-title">游戏记录</div>
      <div class="history" id="history"></div>
    </div>

    <div class="tips">
      本页面为娱乐演示版，不涉及真实充值、提现或交易。<br>
      建议先用这个简化版测试，稳定后再升级后台版本。
    </div>
  </div>

  <script>
    let balance = 1000;
    let point = 1.00;
    let crashPoint = 0;
    let betAmount = 0;
    let timer = null;
    let playing = false;

    const balanceEl = document.getElementById("balance");
    const pointEl = document.getElementById("point");
    const statusEl = document.getElementById("status");
    const betEl = document.getElementById("bet");
    const startBtn = document.getElementById("startBtn");
    const cashoutBtn = document.getElementById("cashoutBtn");
    const historyEl = document.getElementById("history");

    function updateBalance() {
      balanceEl.innerText = balance.toFixed(0);
    }

    function randomCrashPoint() {
      const r = Math.random();

      if (r < 0.50) return +(1 + Math.random() * 1.2).toFixed(2);
      if (r < 0.80) return +(2.2 + Math.random() * 2.5).toFixed(2);
      if (r < 0.95) return +(4.7 + Math.random() * 5).toFixed(2);

      return +(10 + Math.random() * 20).toFixed(2);
    }

    function startGame() {
      if (playing) return;

      betAmount = Number(betEl.value);

      if (!betAmount || betAmount <= 0) {
        statusEl.innerText = "请输入正确下注分数";
        return;
      }

      if (betAmount > balance) {
        statusEl.innerText = "余额不足";
        return;
      }

      balance -= betAmount;
      updateBalance();

      point = 1.00;
      crashPoint = randomCrashPoint();
      playing = true;

      pointEl.innerText = point.toFixed(2) + "x";
      pointEl.style.color = "#22c55e";
      statusEl.innerText = "游戏进行中，随时可以逃跑";

      startBtn.disabled = true;
      cashoutBtn.disabled = false;
      betEl.disabled = true;

      timer = setInterval(() => {
        point += 0.03 + Math.random() * 0.08;
        point = +point.toFixed(2);

        pointEl.innerText = point.toFixed(2) + "x";

        if (point >= crashPoint) {
          crash();
        }
      }, 120);
    }

    function cashOut() {
      if (!playing) return;

      clearInterval(timer);

      const win = betAmount * point;
      balance += win;

      statusEl.innerHTML = `逃跑成功，获得 ${win.toFixed(0)} 分`;
      addHistory(`逃跑成功：${point.toFixed(2)}x，赢得 ${win.toFixed(0)} 分`, true);

      endGame();
    }

    function crash() {
      clearInterval(timer);

      pointEl.innerText = crashPoint.toFixed(2) + "x";
      pointEl.style.color = "#ef4444";
      statusEl.innerHTML = `爆了！爆点：${crashPoint.toFixed(2)}x`;
      addHistory(`爆了：${crashPoint.toFixed(2)}x，损失 ${betAmount} 分`, false);

      endGame();
    }

    function endGame() {
      playing = false;
      startBtn.disabled = false;
      cashoutBtn.disabled = true;
      betEl.disabled = false;
      updateBalance();
    }

    function addHistory(text, isWin) {
      const div = document.createElement("div");
      div.className = "item " + (isWin ? "win" : "lose");
      div.innerText = new Date().toLocaleTimeString() + " - " + text;
      historyEl.prepend(div);
    }

    function resetGame() {
      if (playing) return;

      balance = 1000;
      updateBalance();
      historyEl.innerHTML = "";
      point = 1.00;
      pointEl.innerText = "1.00x";
      pointEl.style.color = "#22c55e";
      statusEl.innerText = "余额已重置";
    }

    updateBalance();
  </script>
</body>
</html>
