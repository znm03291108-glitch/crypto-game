<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>爆点逃跑游戏</title>

  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #020617, #0f172a);
      color: #ffffff;
      min-height: 100vh;
      padding: 16px;
    }

    .app {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      background: #111827;
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.45);
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin: 10px 0 6px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
      margin-bottom: 18px;
      line-height: 1.6;
    }

    .card {
      background: #1f2937;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .wallet-box {
      text-align: center;
    }

    .wallet-status {
      font-size: 14px;
      color: #d1d5db;
      line-height: 1.7;
      word-break: break-all;
      margin-top: 10px;
    }

    .tag-ok {
      color: #22c55e;
      font-weight: bold;
    }

    .tag-warn {
      color: #facc15;
      font-weight: bold;
    }

    .tag-bad {
      color: #ef4444;
      font-weight: bold;
    }

    .balance {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
    }

    .number {
      text-align: center;
      font-size: 58px;
      font-weight: bold;
      color: #22c55e;
      margin: 22px 0;
      transition: 0.15s;
    }

    .status {
      text-align: center;
      min-height: 32px;
      color: #e5e7eb;
      font-size: 16px;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 18px;
      margin-top: 10px;
      background: #374151;
      color: white;
      outline: none;
    }

    input:disabled {
      opacity: 0.55;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: bold;
      margin-top: 12px;
      cursor: pointer;
    }

    .connect {
      background: #38bdf8;
      color: #082f49;
    }

    .check {
      background: #a78bfa;
      color: #2e1065;
    }

    .start {
      background: #22c55e;
      color: #052e16;
    }

    .cashout {
      background: #facc15;
      color: #422006;
    }

    .reset {
      background: #334155;
      color: #ffffff;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .history-title {
      font-size: 18px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .history {
      max-height: 220px;
      overflow-y: auto;
      font-size: 14px;
      color: #d1d5db;
    }

    .item {
      padding: 10px;
      border-radius: 10px;
      background: #374151;
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .win {
      color: #22c55e;
    }

    .lose {
      color: #ef4444;
    }

    .info {
      color: #d1d5db;
    }

    .tips {
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
      line-height: 1.8;
      margin-top: 12px;
    }

    .locked {
      opacity: 0.45;
      pointer-events: none;
    }

    .small {
      font-size: 12px;
      color: #9ca3af;
      line-height: 1.6;
      margin-top: 8px;
    }

    .contract {
      font-size: 12px;
      color: #9ca3af;
      word-break: break-all;
      line-height: 1.6;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <div class="app">
    <h1>爆点逃跑</h1>

    <div class="subtitle">
      连接 BSC 钱包，持有平台币即可进入游戏<br>
      点数上涨前逃跑，逃早赢少，逃晚可能爆掉
    </div>

    <div class="card wallet-box">
      <button class="connect" onclick="connectWallet()">连接钱包 / 检测持币</button>
      <button class="check" onclick="checkTokenBalance()">重新检测持币</button>

      <div class="wallet-status" id="walletStatus">
        请先使用 MetaMask、OKX 钱包或 TokenPocket 打开网站
      </div>

      <div class="contract">
        平台币合约：<br>
        0x7aaaa5b10f97321345acd76945083141be1c5631
      </div>
    </div>

    <div id="gameArea" class="locked">
      <div class="card balance">
        <div>模拟余额</div>
        <div><b id="balance">1000</b> 分</div>
      </div>

      <div class="card">
        <div class="number" id="point">1.00x</div>

        <div class="status" id="status">
          连接钱包并通过持币检测后开始游戏
        </div>

        <input id="bet" type="number" value="10" min="1" placeholder="输入下注分数" />

        <button class="start" id="startBtn" onclick="startGame()">开始游戏</button>
        <button class="cashout" id="cashoutBtn" onclick="cashOut()" disabled>立即逃跑</button>
        <button class="reset" onclick="resetGame()">重置余额</button>
      </div>

      <div class="card">
        <div class="history-title">游戏记录</div>
        <div class="history" id="history"></div>
      </div>
    </div>

    <div class="tips">
      本页面为娱乐演示版。<br>
      不涉及真实充值、提现、下注或链上转账。<br>
      仅检测钱包是否持有指定 BSC 平台币。
    </div>
  </div>

  <script>
    /***********************
     * 基础配置
     ***********************/

    // BSC 平台币合约地址
    const TOKEN_ADDRESS = "0x7aaaa5b10f97321345acd76945083141be1c5631";

    // 最低持币数量：默认持有 1 个币即可玩
    const MIN_TOKEN_AMOUNT = 1;

    // BSC 主网 Chain ID
    const BSC_CHAIN_ID = "0x38";

    const BSC_CONFIG = {
      chainId: BSC_CHAIN_ID,
      chainName: "BNB Smart Chain",
      nativeCurrency: {
        name: "BNB",
        symbol: "BNB",
        decimals: 18
      },
      rpcUrls: ["https://bsc-dataseed.binance.org/"],
      blockExplorerUrls: ["https://bscscan.com"]
    };

    const ERC20_ABI = [
      "function balanceOf(address owner) view returns (uint256)",
      "function decimals() view returns (uint8)",
      "function symbol() view returns (string)",
      "function name() view returns (string)"
    ];

    /***********************
     * 状态变量
     ***********************/

    let provider = null;
    let signer = null;
    let userAddress = "";
    let tokenSymbol = "TOKEN";
    let tokenDecimals = 18;
    let allowedToPlay = false;

    let balance = 1000;
    let point = 1.00;
    let crashPoint = 0;
    let betAmount = 0;
    let timer = null;
    let playing = false;

    /***********************
     * 页面元素
     ***********************/

    const walletStatusEl = document.getElementById("walletStatus");
    const gameAreaEl = document.getElementById("gameArea");
    const balanceEl = document.getElementById("balance");
    const pointEl = document.getElementById("point");
    const statusEl = document.getElementById("status");
    const betEl = document.getElementById("bet");
    const startBtn = document.getElementById("startBtn");
    const cashoutBtn = document.getElementById("cashoutBtn");
    const historyEl = document.getElementById("history");

    /***********************
     * 钱包连接
     ***********************/

    async function connectWallet() {
      try {
        if (!window.ethereum) {
          walletStatusEl.innerHTML =
            '<span class="tag-bad">未检测到钱包</span><br>' +
            '请用 MetaMask、OKX 钱包或 TokenPocket 的内置浏览器打开。';
          return;
        }

        walletStatusEl.innerHTML =
          '<span class="tag-warn">正在连接钱包...</span>';

        await window.ethereum.request({
          method: "eth_requestAccounts"
        });

        await switchToBSC();

        provider = new ethers.providers.Web3Provider(window.ethereum);
        signer = provider.getSigner();
        userAddress = await signer.getAddress();

        await checkTokenBalance();

        bindWalletEvents();

      } catch (error) {
        walletStatusEl.innerHTML =
          '<span class="tag-bad">连接失败</span><br>' +
          getErrorMessage(error);
      }
    }

    async function switchToBSC() {
      const currentChainId = await window.ethereum.request({
        method: "eth_chainId"
      });

      if (currentChainId === BSC_CHAIN_ID) return;

      try {
        await window.ethereum.request({
          method: "wallet_switchEthereumChain",
          params: [{ chainId: BSC_CHAIN_ID }]
        });
      } catch (switchError) {
        if (switchError.code === 4902) {
          await window.ethereum.request({
            method: "wallet_addEthereumChain",
            params: [BSC_CONFIG]
          });
        } else {
          throw new Error("请先切换到 BSC 网络");
        }
      }
    }

    async function checkTokenBalance() {
      try {
        if (!window.ethereum) {
          walletStatusEl.innerHTML =
            '<span class="tag-bad">未检测到钱包</span>';
          return;
        }

        await switchToBSC();

        provider = new ethers.providers.Web3Provider(window.ethereum);
        signer = provider.getSigner();
        userAddress = await signer.getAddress();

        walletStatusEl.innerHTML =
          '<span class="tag-warn">正在检测持币...</span><br>' +
          shortAddress(userAddress);

        const token = new ethers.Contract(
          TOKEN_ADDRESS,
          ERC20_ABI,
          provider
        );

        try {
          tokenDecimals = await token.decimals();
        } catch (e) {
          tokenDecimals = 18;
        }

        try {
          tokenSymbol = await token.symbol();
        } catch (e) {
          tokenSymbol = "TOKEN";
        }

        const rawBalance = await token.balanceOf(userAddress);
        const tokenBalance = Number(
          ethers.utils.formatUnits(rawBalance, tokenDecimals)
        );

        if (tokenBalance >= MIN_TOKEN_AMOUNT) {
          allowedToPlay = true;
          gameAreaEl.classList.remove("locked");

          walletStatusEl.innerHTML =
            '<span class="tag-ok">持币检测通过</span><br>' +
            '钱包：' + shortAddress(userAddress) + '<br>' +
            '持币：' + formatAmount(tokenBalance) + ' ' + tokenSymbol + '<br>' +
            '已获得游戏权限';

          statusEl.innerText = "持币检测通过，可以开始游戏";
          addHistory("持币检测通过，已获得游戏权限", true);
        } else {
          allowedToPlay = false;
          gameAreaEl.classList.add("locked");

          walletStatusEl.innerHTML =
            '<span class="tag-bad">持币不足</span><br>' +
            '钱包：' + shortAddress(userAddress) + '<br>' +
            '当前持币：' + formatAmount(tokenBalance) + ' ' + tokenSymbol + '<br>' +
            '至少需要持有 ' + MIN_TOKEN_AMOUNT + ' ' + tokenSymbol + ' 才能玩';

          statusEl.innerText = "持币不足，暂时不能开始游戏";
        }

      } catch (error) {
        allowedToPlay = false;
        gameAreaEl.classList.add("locked");

        walletStatusEl.innerHTML =
          '<span class="tag-bad">检测失败</span><br>' +
          getErrorMessage(error);
      }
    }

    function bindWalletEvents() {
      if (!window.ethereum) return;

      window.ethereum.removeAllListeners &&
        window.ethereum.removeAllListeners("accountsChanged");

      window.ethereum.removeAllListeners &&
        window.ethereum.removeAllListeners("chainChanged");

      window.ethereum.on("accountsChanged", function () {
        stopIfPlaying();
        checkTokenBalance();
      });

      window.ethereum.on("chainChanged", function () {
        stopIfPlaying();
        setTimeout(checkTokenBalance, 500);
      });
    }

    /***********************
     * 游戏逻辑
     ***********************/

    function startGame() {
      if (!allowedToPlay) {
        statusEl.innerText = "请先连接钱包并通过持币检测";
        return;
      }

      if (playing) return;

      betAmount = Number(betEl.value);

      if (!betAmount || betAmount <= 0) {
        statusEl.innerText = "请输入正确下注分数";
        return;
      }

      if (betAmount > balance) {
        statusEl.innerText = "模拟余额不足";
        return;
      }

      balance -= betAmount;
      updateBalance();

      point = 1.00;
      crashPoint = randomCrashPoint();
      playing = true;

      pointEl.innerText = point.toFixed(2) + "x";
      pointEl.style.color = "#22c55e";

      statusEl.innerText = "游戏进行中，随时可以逃跑";

      startBtn.disabled = true;
      cashoutBtn.disabled = false;
      betEl.disabled = true;

      timer = setInterval(function () {
        point += 0.03 + Math.random() * 0.08;
        point = Number(point.toFixed(2));

        pointEl.innerText = point.toFixed(2) + "x";

        if (point >= crashPoint) {
          crash();
        }
      }, 120);
    }

    function cashOut() {
      if (!playing) return;

      clearInterval(timer);

      const winAmount = betAmount * point;
      balance += winAmount;

      statusEl.innerHTML =
        "逃跑成功，获得 " + winAmount.toFixed(0) + " 分";

      addHistory(
        "逃跑成功：" +
          point.toFixed(2) +
          "x，赢得 " +
          winAmount.toFixed(0) +
          " 分",
        true
      );

      endGame();
    }

    function crash() {
      clearInterval(timer);

      pointEl.innerText = crashPoint.toFixed(2) + "x";
      pointEl.style.color = "#ef4444";

      statusEl.innerHTML =
        "爆了！爆点：" + crashPoint.toFixed(2) + "x";

      addHistory(
        "爆了：" +
          crashPoint.toFixed(2) +
          "x，损失 " +
          betAmount +
          " 分",
        false
      );

      endGame();
    }

    function endGame() {
      playing = false;
      startBtn.disabled = false;
      cashoutBtn.disabled = true;
      betEl.disabled = false;
      updateBalance();
    }

    function stopIfPlaying() {
      if (playing) {
        clearInterval(timer);
        playing = false;
        startBtn.disabled = false;
        cashoutBtn.disabled = true;
        betEl.disabled = false;
        statusEl.innerText = "钱包或网络发生变化，本局已停止";
      }
    }

    function resetGame() {
      if (playing) {
        statusEl.innerText = "游戏进行中，不能重置";
        return;
      }

      balance = 1000;
      point = 1.00;
      betAmount = 0;
      crashPoint = 0;

      updateBalance();

      historyEl.innerHTML = "";
      pointEl.innerText = "1.00x";
      pointEl.style.color = "#22c55e";

      statusEl.innerText = allowedToPlay
        ? "余额已重置，可以开始游戏"
        : "连接钱包并通过持币检测后开始游戏";
    }

    function randomCrashPoint() {
      const r = Math.random();

      if (r < 0.50) {
        return Number((1 + Math.random() * 1.2).toFixed(2));
      }

      if (r < 0.80) {
        return Number((2.2 + Math.random() * 2.5).toFixed(2));
      }

      if (r < 0.95) {
        return Number((4.7 + Math.random() * 5).toFixed(2));
      }

      return Number((10 + Math.random() * 20).toFixed(2));
    }

    /***********************
     * 工具函数
     ***********************/

    function updateBalance() {
      balanceEl.innerText = balance.toFixed(0);
    }

    function addHistory(text, isWin) {
      const div = document.createElement("div");

      if (isWin === true) {
        div.className = "item win";
      } else if (isWin === false) {
        div.className = "item lose";
      } else {
        div.className = "item info";
      }

      div.innerText =
        new Date().toLocaleTimeString() + " - " + text;

      historyEl.prepend(div);
    }

    function shortAddress(address) {
      if (!address) return "";
      return address.slice(0, 6) + "..." + address.slice(-4);
    }

    function formatAmount(num) {
      if (!isFinite(num)) return "0";
      if (num >= 1000000) return num.toFixed(0);
      if (num >= 1000) return num.toFixed(2);
      if (num >= 1) return num.toFixed(4);
      return num.toFixed(8);
    }

    function getErrorMessage(error) {
      if (!error) return "未知错误";

      const msg = error.message || String(error);

      if (msg.includes("user rejected") || msg.includes("User rejected")) {
        return "你取消了钱包授权";
      }

      if (msg.includes("network") || msg.includes("NETWORK")) {
        return "网络连接失败，请稍后重试";
      }

      if (msg.includes("call revert")) {
        return "合约读取失败，请确认这是 BSC 代币合约地址";
      }

      return msg;
    }

    updateBalance();
  </script>
</body>
</html>
